<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101014">
  <title>Meme Maker</title>
  <link rel="stylesheet" href="style.css?v=single-bg-1">
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">PROSTY GENERATOR MEMÓW</div>
      <h1>Meme<span>Maker.</span></h1>
      <p>Dodaj tekst do stałego zdjęcia i pobierz gotowy mem.</p>
    </header>

    <section class="workspace">
      <div class="controls">
        <label for="topText">Tekst mema</label>
        <textarea id="topText" placeholder="WPISZ TEKST..." maxlength="120" rows="4"></textarea>

        <label class="size-label" for="textSize">
          Rozmiar tekstu <output id="textSizeValue" for="textSize">4%</output>
        </label>
        <input id="textSize" type="range" min="1" max="10" step="0.5" value="4" aria-label="Rozmiar tekstu na zdjęciu">

        <button id="downloadButton" class="download" disabled>Pobierz mema <span>↓</span></button>
        <p class="hint">To zdjęcie jest ustawione jako tło. Możesz wpisać tekst i pobrać wynik bez wgrywania plików.</p>
      </div>

      <div class="preview-wrap">
        <div class="preview-heading"><span>PODGLĄD</span><span id="imageStatus">ŁADOWANIE TŁA...</span></div>
        <div class="preview" id="preview">
          <div class="placeholder"><span>▧</span><strong>Ładowanie zdjęcia tła...</strong><small>Proszę czekać</small></div>
          <canvas id="memeCanvas" hidden></canvas>
        </div>
      </div>
    </section>
    <footer>MEMEMAKER · BURST MY BUBBLE</footer>
  </main>
  <script src="script.js?v=single-bg-1"></script>
</body>
</html>
